services:
  backend:
    image: ghcr.io/eliasablan/9dec-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      platforms:
        - linux/amd64

  frontend:
    image: ghcr.io/eliasablan/9dec-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      platforms:
        - linux/amd64
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8787}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8787/ws}

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-test-9dec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
