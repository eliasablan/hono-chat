services:
  backend:
    image: ghcr.io/eliasablan/hono-chat-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      platforms:
        - linux/amd64
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  frontend:
    image: ghcr.io/eliasablan/hono-chat-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      platforms:
        - linux/amd64
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8787}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8787/ws}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
